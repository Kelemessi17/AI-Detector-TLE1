<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReelDetect</title>
    <link rel="stylesheet" href="index.css">
    <script type="text/javascript" src="home.js" defer></script>
</head>

<body>

<header>

    <nav>
        <h1> ReelDetect </h1>
        <select>
            <option>🇳🇱 Nederlands</option>
            <option>🇬🇧 English</option>
            <option>🇪🇸 Español</option>
            <option>🇮🇹 Italiano</option>
            <option>🇹🇷 Türkçe</option>
            <option>🇨🇳 中文</option>
        </select>
    </nav>
</header>

<main>


</main>


<main class="container">

    <div class="method-buttons">
        <button id="videoButton">🎥 Video uploaden</button>
        <button id="urlButton">🔗 URL invullen</button>
    </div>

    <section class="detector-box">

        <h2>Controleer je video</h2>

        <p id="descriptionUpload" class="description-Upload">
            Upload een video en controleer of deze mogelijk door AI is gemaakt.
        </p>

        <p id="descriptionUrl" class="description-Url">
            Voer de url van de video in en controleer of deze mogelijk door AI is gemaakt.
        </p>


        <label for="videoInput" class="upload-area" id="videoUpload">
            <span class="upload-icon">📁</span>
            <span id="uploadText">Klik hier om een video te uploaden</span>
            <small>MP4, MOV, AVI etc.</small>
        </label>

        <div for="urlInput" class="url-upload" id="urlUpload">
            <input type="text" placeholder="Plak hier de URL van je video">
        </div>

        <input type="file" id="videoInput" accept="video/*" hidden>

        <div id="videoPreview" class="video-preview">
            <video id="videoPlayer" controls></video>
        </div>


        <button id="checkButton" class="check-button" disabled> ✓ Check video</button>

        <div id="loading" class="loading">

            <div class="spinner"></div>

            <p>Video wordt gecontroleerd...</p>

            <div class="percentage" id="percentage">
                0%
            </div>

        </div>
        
        <div id="result" class="result">

            <div id="resultIcon" class="result-icon"></div>

            <h2 id="resultTitle"></h2>

            <p id="resultText"></p>

            <button id="againButton" class="again-button">
                Opnieuw controleren
            </button>

        </div>

    </section>

</main>

</body>

</html>

<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReelDetect</title>
    <link rel="stylesheet" href="index.css">
    <script src="text/javascript" src="js/main.js" defer></script>
</head>

<body>

<header>

    <nav>
        <h1> ReelDetect </h1>
        <select>
            <option>🇳🇱 Nederlands</option>
            <option>🇬🇧 English</option>
            <option>🇪🇸 Español</option>
            <option>🇮🇹 Italiano</option>
            <option>🇹🇷 Türkçe</option>
            <option>🇨🇳 中文</option>
        </select>
    </nav>
</header>

<main>


</main>


<main class="container">

    <section class="detector-box">

        <h2>Controleer je video</h2>

        <p class="description">
            Upload een video en controleer of deze mogelijk door AI is gemaakt.
        </p>

        <!-- Video upload -->
        <label for="videoInput" class="upload-area">
            <span class="upload-icon">📁</span>
            <span id="uploadText">Klik hier om een video te uploaden</span>
            <small>MP4, MOV, AVI etc.</small>
        </label>

        <input
                type="file"
                id="videoInput"
                accept="video/*"
                hidden
        >

        <!-- Geselecteerde video -->
        <div id="videoPreview" class="video-preview">
            <video id="videoPlayer" controls></video>
        </div>

        <!-- Check knop -->
        <button id="checkButton" class="check-button" disabled>
            ✓ Check video
        </button>

        <!-- Loading -->
        <div id="loading" class="loading">

            <div class="spinner"></div>

            <p>Video wordt gecontroleerd...</p>

            <div class="percentage" id="percentage">
                0%
            </div>

        </div>

        <!-- Resultaat -->
        <div id="result" class="result">

            <div id="resultIcon" class="result-icon"></div>

            <h2 id="resultTitle"></h2>

            <p id="resultText"></p>

            <button id="againButton" class="again-button">
                Opnieuw controleren
            </button>

        </div>

    </section>

</main>

</body>

</html>
